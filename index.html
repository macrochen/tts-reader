<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朗读器 - Edge TTS</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar {
            background: white;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #e0e0e0;
            flex-wrap: wrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toolbar-group label {
            font-size: 13px;
            color: #666;
            white-space: nowrap;
        }

        .paste-btn {
            background: #27ae60;
        }

        .paste-btn:hover {
            background: #219a52;
        }

        button {
            background: #4A90E9;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        button:hover {
            background: #357ABD;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        button.secondary {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }

        button.secondary:hover {
            background: #e0e0e0;
        }

        button.danger {
            background: #e74c3c;
        }

        button.danger:hover {
            background: #c0392b;
        }

        select, input[type="range"] {
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            background: white;
        }

        input[type="range"] {
            width: 120px;
            cursor: pointer;
        }

        .rate-value {
            font-weight: bold;
            min-width: 40px;
            text-align: center;
            color: #4A90E9;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .input-panel, .output-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 10px 16px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            font-weight: 600;
            font-size: 14px;
            color: #555;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-content {
            flex: 1;
            overflow: auto;
            padding: 16px;
            overflow-anchor: none;
        }

        #inputText {
            width: 100%;
            height: 100%;
            border: none;
            resize: none;
            font-family: "SF Mono", Menlo, monospace;
            font-size: 14px;
            line-height: 1.6;
            padding: 0;
            outline: none;
            background: white;
        }

        #outputText {
            background: white;
            border-radius: 8px;
            padding: 20px;
            min-height: 100%;
            font-size: 16px;
            line-height: 1.8;
        }

        #outputText h1, #outputText h2, #outputText h3,
        #outputText h4, #outputText h5, #outputText h6 {
            margin: 1.2em 0 0.6em;
            font-weight: 600;
        }

        #outputText p {
            margin: 0.8em 0;
        }

        #outputText code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: "SF Mono", Menlo, monospace;
            font-size: 0.9em;
        }

        #outputText pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 1em 0;
        }

        #outputText pre code {
            background: none;
            padding: 0;
            color: inherit;
        }

        #outputText blockquote {
            border-left: 4px solid #4A90E9;
            padding-left: 16px;
            margin: 1em 0;
            color: #555;
            font-style: italic;
        }

        #outputText ul, #outputText ol {
            padding-left: 24px;
            margin: 0.8em 0;
        }

        #outputText li {
            margin: 0.3em 0;
        }

        /* 高亮样式 */
        .highlight-overlay {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            overflow-anchor: none;
        }

        .highlight-segment {
            position: absolute;
            background: rgba(255, 230, 0, 0.4);
            border-radius: 3px;
            pointer-events: none;
            transition: all 0.15s ease;
        }

        /* 进度条 */
        .progress-bar {
            height: 4px;
            background: #e0e0e0;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: #4A90E9;
            width: 0%;
            transition: width 0.3s;
        }

        /* 状态指示器 */
        .status {
            font-size: 12px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
        }

        .status-dot.playing {
            background: #27ae60;
            animation: pulse 1.5s infinite;
        }

        .status-dot.paused {
            background: #f39c12;
        }

        .status-dot.loading {
            background: #3498db;
            animation: spin 1s linear infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 加载中遮罩 */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            display: none;
        }

        .loading-overlay.show {
            display: flex;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    <!-- 工具栏 -->
    <div class="toolbar">
        <div class="toolbar-group">
            <button class="paste-btn" onclick="pasteFromClipboard()">📋 读取剪贴板</button>
            <button id="playBtn" onclick="togglePlay()">
                <span id="playIcon">▶</span>
                <span id="playText">播放</span>
            </button>
            <button class="secondary" onclick="stopPlay()">⏹ 停止</button>
        </div>

        <div class="toolbar-group">
            <label>语速:</label>
            <input type="range" id="rateSlider" min="0.5" max="3" step="0.25" value="2" oninput="updateRate()">
            <span class="rate-value" id="rateValue">2x</span>
        </div>

        <div class="toolbar-group">
            <label>语音:</label>
            <select id="voiceSelect" onchange="changeVoice()">
                <option value="">加载中...</option>
            </select>
        </div>

        <div class="toolbar-group">
            <label>音量:</label>
            <input type="range" id="volumeSlider" min="-50" max="50" step="10" value="0" oninput="updateVolume()">
        </div>

        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">就绪</span>
        </div>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- 主内容区 -->
    <div class="main-container">
        <div class="input-panel">
            <div class="panel-header">
                <span>📝 输入文字 (支持 Markdown)</span>
                <button class="secondary" onclick="clearInput()" style="padding: 4px 8px; font-size: 12px;">清空</button>
            </div>
            <div class="panel-content">
                <textarea id="inputText" placeholder="在这里输入或粘贴文字，支持 Markdown 格式...

示例：
# 标题
这是**粗体**和*斜体*。

> 引用文字

- 列表项 1
- 列表项 2"></textarea>
            </div>
        </div>

        <div class="output-panel" style="position: relative;">
            <div class="panel-header">
                <span>👁 预览 & 朗读</span>
                <span id="charCount" style="font-size: 12px; color: #888; font-weight: normal;"></span>
            </div>
            <div class="panel-content" id="panelContent" style="position: relative;">
                <div id="outputText">
                    <p style="color: #999; text-align: center; margin-top: 50px;">
                        在左侧输入文字后，点击「播放」开始朗读
                    </p>
                </div>
                <div id="highlightOverlay" class="highlight-overlay" style="display: none;"></div>
            </div>
            <div class="loading-overlay" id="loadingOverlay">
                <div class="loading-spinner"></div>
                <span style="margin-left: 12px; color: #666;">正在生成语音...</span>
            </div>
        </div>
    </div>

    <script>
        require('./src/renderer');
    </script>
</body>
</html>
